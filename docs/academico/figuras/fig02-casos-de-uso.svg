 x="442" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2735" text-anchor="middle">Vincular motorista a veículo</text><ellipse cx="442" cy="465" rx="185" ry="21" fill="#F2F4F7" stroke="#5A6B80" stroke-width="1.2"/><text x="442" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2735" text-anchor="middle">Gerir usuários e aprovações</text><line x1="128" y1="145" x2="262" y2="110" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="145" x2="262" y2="160" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="145" x2="262" y2="210" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="145" x2="262" y2="260" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="290" x2="262" y2="310" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="290" x2="262" y2="360" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="290" x2="262" y2="410" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="290" x2="262" y2="160" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="435" x2="262" y2="465" stroke="#1B2735" stroke-width="1.3"/><line x1="128" y1="435" x2="262" y2="410" stroke="#1B2735" stroke-width="1.3"/><text x="442" y="545" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6B80" text-anchor="middle">O Gestor herda os casos do Operador; o Administrador herda os do Gestor.</text></svg>